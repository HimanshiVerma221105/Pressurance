<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pressurance – 3D Human Model</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
      
      :root {
        --primary: #3066BE;
        --primary-dark: #2854A1;
        --secondary: #00B4D8;
        --accent: #FF5F5D;
        --accent-hover: #FF7775;
        --light-bg: #F0F7FF;
        --white: #FFFFFF;
        --text-dark: #1A2A3A;
        --text-medium: #455A70;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: 'Montserrat', 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, var(--light-bg) 0%, #E6F0FF 100%);
        color: var(--text-dark);
        overflow: hidden;
      }

      canvas {
        display: block;
        height: 100%;
        width: 100%;
      }

      header, footer {
        position: fixed;
        left: 0;
        right: 0;
        background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        color: var(--white);
        padding: 16px 24px;
        text-align: center;
        z-index: 10;
        box-shadow: var(--shadow);
        transition: transform 0.3s ease;
      }

      header {
        top: 0;
        font-size: 1.8em;
        font-weight: 600;
        letter-spacing: 0.5px;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
      }

      footer {
        bottom: 0;
        font-size: 1em;
        font-weight: 500;
        letter-spacing: 0.3px;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      footer::after {
        content: '💆‍♀️';
        font-size: 1.2em;
        display: inline-block;
        animation: float 2s ease-in-out infinite;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      #tooltip {
        position: absolute;
        background: var(--accent);
        color: var(--white);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        pointer-events: none;
        display: none;
        z-index: 100;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        transform: translateY(0);
        transition: all 0.2s ease;
      }

      #tooltip::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 6px solid var(--accent);
      }

      /* Add a subtle pulse animation to the canvas */
      @keyframes pulse {
        0% { opacity: 0.95; }
        50% { opacity: 1; }
        100% { opacity: 0.95; }
      }

      canvas {
        animation: pulse 4s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app"></div>
  <!-- <script type="module" src="/main.js"></script> -->
    <header>Pressurance – Select Pain Region</header>

    <!-- Tooltip for Pain Zones -->
    <div id="tooltip"></div>

    <script type="module" src="./main.js"></script>

    <footer>Empowering Relief Through Technology</footer>
  </body>
</html>
